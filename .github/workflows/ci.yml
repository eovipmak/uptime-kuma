name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-tsc-build:
    name: Lint, tsc, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm clean-install --no-audit --no-fund

      - name: Lint (eslint + stylelint)
        run: npm run lint

      - name: TypeScript check (backend)
        run: npm run tsc

      - name: Guard committed util.js against emit drift
        run: git diff --exit-code src/util.js

      - name: Build frontend
        run: npm run build
